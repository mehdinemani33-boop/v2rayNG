name: Custom V2RayNG Build

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Build Unsigned Release APK
      run: |
        chmod +x V2rayNG/gradlew
        cd V2rayNG
        ./gradlew assembleFdroidRelease --no-daemon

    - name: Upload Custom APK
      uses: actions/upload-artifact@v4
      with:
        name: My-Custom-V2RayNG
        path: V2rayNG/app/build/outputs/apk/**/*.apk
