name: Custom V2RayNG Build

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Download Valid AAR Core
      run: |
        mkdir -p V2rayNG/app/libs
        cd V2rayNG/app/libs
        # دانلود مستقیم فایل AAR معتبر با wget (نه curl) برای جلوگیری از دانلود HTML
        wget -q -O libv2ray.aar "https://github.com/2dust/v2rayNG/raw/main/V2rayNG/app/libs/libv2ray.aar" || true
        
        # تست صحت فایل زیپ/AAR
        if ! unzip -t libv2ray.aar >/dev/null 2>&1; then
          echo "File invalid, fetching backup release core..."
          wget -q -O libv2ray.aar "https://raw.githubusercontent.com/2dust/v2rayNG/master/V2rayNG/app/libs/libv2ray.aar"
        fi

    - name: Build Debug APK
      run: |
        chmod +x V2rayNG/gradlew
        cd V2rayNG
        ./gradlew assembleFdroidDebug --no-daemon

    - name: Upload Custom APK
      uses: actions/upload-artifact@v4
      with:
        name: My-Custom-V2RayNG
        path: V2rayNG/app/build/outputs/apk/**/*.apk
