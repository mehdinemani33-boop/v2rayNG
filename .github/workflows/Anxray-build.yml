name: Custom V2RayNG Build

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Extract Core AAR from Official Release
      run: |
        mkdir -p V2rayNG/app/libs
        cd V2rayNG/app/libs
        # دانلود آخرین APK رسمی v2rayNG
        curl -L -o temp_app.apk https://github.com/2dust/v2rayNG/releases/download/1.9.15/v2rayNG_1.9.15_arm64-v8a.apk || true
        # اگر فایل خالی یا ناموفق بود از نسخه کلی استفاده کن
        if [ ! -s temp_app.apk ]; then
          curl -L -o temp_app.apk https://github.com/2dust/v2rayNG/releases/download/1.8.12/v2rayNG_1.8.12.apk
        fi
        
        # استخراج لایبرری‌های کالمپایل شده داخل پروژه
        unzip -q temp_app.apk "lib/*" -d extracted_libs/ || true
        rm -f temp_app.apk

    - name: Build Custom Debug APK
      run: |
        chmod +x V2rayNG/gradlew
        cd V2rayNG
        # ساخت نسخه Debug اختصاصی بدون نیاز به gomobile یا کلید امضا
        ./gradlew assembleFdroidDebug --no-daemon -x test

    - name: Upload Custom APK
      uses: actions/upload-artifact@v4
      with:
        name: My-Custom-V2RayNG
        path: V2rayNG/app/build/outputs/apk/**/*.apk
