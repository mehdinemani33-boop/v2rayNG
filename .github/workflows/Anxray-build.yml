name: Custom V2RayNG Build

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Download Valid Libv2ray AAR Core
      run: |
        mkdir -p V2rayNG/app/libs
        # دریافت مستقیم آخرین نسخه معتبر libv2ray.aar از رleaseهای رسمی
        curl -L -o V2rayNG/app/libs/libv2ray.aar https://github.com/2dust/v2rayNG/releases/download/1.9.15/v2rayNG_1.9.15.apk || true
        # استخراج مستقیم فایل AAR از پروژه در صورت نیاز
        cd V2rayNG/app/libs
        if [ ! -s libv2ray.aar ]; then
          curl -L -o libv2ray.aar https://raw.githubusercontent.com/2dust/v2rayNG/master/V2rayNG/app/libs/libv2ray.aar
        fi

    - name: Build Unsigned APK
      run: |
        chmod +x V2rayNG/gradlew
        cd V2rayNG
        # ساخت نسخه Debug که نیازی به هیچ امضا و کلیدی ندارد
        ./gradlew assembleFdroidDebug --no-daemon

    - name: Upload Custom APK
      uses: actions/upload-artifact@v4
      with:
        name: My-Custom-V2RayNG
        path: V2rayNG/app/build/outputs/apk/**/*.apk
