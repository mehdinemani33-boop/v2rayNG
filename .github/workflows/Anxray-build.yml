name: Custom V2RayNG Build

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        fetch-depth: 0

    - name: Set up Go 1.21
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Download and Validate Core AAR
      run: |
        mkdir -p V2rayNG/app/libs
        cd V2rayNG/app/libs
        
        # دانلود مستقیم سورس ریلیز واقعی برای استخراج libv2ray.aar معتبر
        curl -L -o release.zip https://github.com/2dust/v2rayNG/archive/refs/heads/master.zip
        unzip -q release.zip
        
        # اگر فایل AAR توی سورس اصلی نبود، از وب‌سایت رسمی ریلیز دانلود و تست می‌شود
        if [ ! -f v2rayNG-master/V2rayNG/app/libs/libv2ray.aar ]; then
          curl -L -o libv2ray.aar https://raw.githubusercontent.com/2dust/v2rayNG/master/V2rayNG/app/libs/libv2ray.aar
        else
          cp v2rayNG-master/V2rayNG/app/libs/libv2ray.aar ./libv2ray.aar
        fi
        
        rm -rf release.zip v2rayNG-master

    - name: Build Debug APK
      run: |
        chmod +x V2rayNG/gradlew
        cd V2rayNG
        ./gradlew assembleFdroidDebug --no-daemon

    - name: Upload Custom APK
      uses: actions/upload-artifact@v4
      with:
        name: My-Custom-V2RayNG
        path: V2rayNG/app/build/outputs/apk/**/*.apk
