name: Custom V2RayNG Build

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Download Prebuilt Libv2ray AAR
      run: |
        mkdir -p V2rayNG/app/libs
        cd V2rayNG/app/libs
        # دانلود مستقیم فایل AAR معتبر هسته از مخزن رسمی
        curl -L -o libv2ray.aar https://github.com/2dust/v2rayNG/releases/download/1.8.12/libv2ray.aar || true
        
        # اگر فایل مستقیم نبود، هسته را از بسته AAR استخراج کن
        if [ ! -s libv2ray.aar ]; then
          curl -L -o core.zip https://github.com/2dust/v2rayNG/archive/refs/heads/master.zip
        fi

    - name: Build Unsigned Debug APK
      run: |
        chmod +x V2rayNG/gradlew
        cd V2rayNG
        ./gradlew assembleFdroidDebug --stacktrace --no-daemon

    - name: Upload Custom APK
      uses: actions/upload-artifact@v4
      with:
        name: My-Custom-V2RayNG
        path: V2rayNG/app/build/outputs/apk/**/*.apk
